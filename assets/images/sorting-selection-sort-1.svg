<svg xmlns="http://www.w3.org/2000/svg" width="640" height="370" viewBox="0 0 640 370" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Selection sort on 5 3 4 1: pass 1 swaps 1 to the front, passes 2 and 3 find the minimum already in place</title>
  <rect width="640" height="370" rx="16" fill="#f8fafc"/>
  <text x="320" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Selection sort on [5, 3, 4, 1]: move the minimum to the front</text>
  <rect x="40" y="56" width="60" height="44" rx="8" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/><text x="70" y="85" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">5</text>
  <rect x="112" y="56" width="60" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="142" y="85" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">3</text>
  <rect x="184" y="56" width="60" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="214" y="85" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">4</text>
  <rect x="256" y="56" width="60" height="44" rx="8" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/><text x="286" y="85" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">1</text>
  <text x="340" y="84" font-size="15" fill="#334155">pass 1: min is 1 → swap with 5</text>
  <text x="178" y="126" text-anchor="middle" font-size="22" fill="#94a3b8">↓</text>
  <rect x="40" y="136" width="60" height="44" rx="8" fill="#bbf7d0" stroke="#22c55e" stroke-width="2"/><text x="70" y="165" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">1</text>
  <rect x="112" y="136" width="60" height="44" rx="8" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/><text x="142" y="165" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">3</text>
  <rect x="184" y="136" width="60" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="214" y="165" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">4</text>
  <rect x="256" y="136" width="60" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="286" y="165" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">5</text>
  <text x="340" y="164" font-size="15" fill="#334155">pass 2: min of rest is 3 → stays</text>
  <text x="178" y="206" text-anchor="middle" font-size="22" fill="#94a3b8">↓</text>
  <rect x="40" y="216" width="60" height="44" rx="8" fill="#bbf7d0" stroke="#22c55e" stroke-width="2"/><text x="70" y="245" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">1</text>
  <rect x="112" y="216" width="60" height="44" rx="8" fill="#bbf7d0" stroke="#22c55e" stroke-width="2"/><text x="142" y="245" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">3</text>
  <rect x="184" y="216" width="60" height="44" rx="8" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/><text x="214" y="245" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">4</text>
  <rect x="256" y="216" width="60" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="286" y="245" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">5</text>
  <text x="340" y="244" font-size="15" fill="#334155">pass 3: min of rest is 4 → stays</text>
  <text x="178" y="286" text-anchor="middle" font-size="22" fill="#94a3b8">↓</text>
  <rect x="40" y="296" width="60" height="44" rx="8" fill="#bbf7d0" stroke="#22c55e" stroke-width="2"/><text x="70" y="325" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">1</text>
  <rect x="112" y="296" width="60" height="44" rx="8" fill="#bbf7d0" stroke="#22c55e" stroke-width="2"/><text x="142" y="325" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">3</text>
  <rect x="184" y="296" width="60" height="44" rx="8" fill="#bbf7d0" stroke="#22c55e" stroke-width="2"/><text x="214" y="325" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">4</text>
  <rect x="256" y="296" width="60" height="44" rx="8" fill="#bbf7d0" stroke="#22c55e" stroke-width="2"/><text x="286" y="325" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">5</text>
  <text x="340" y="324" font-size="15" font-weight="700" fill="#15803d">sorted: 6 comparisons, 1 swap</text>
</svg>
