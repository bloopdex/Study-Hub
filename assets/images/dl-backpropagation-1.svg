<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Backpropagation on one neuron</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
  <rect width="700" height="300" rx="16" fill="#f8fafc"/>
  <text x="350" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Forward values, backward gradients</text>
  <line x1="150.0" y1="90.0" x2="200.0" y2="90.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="320.0" y1="90.0" x2="370.0" y2="90.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="490.0" y1="90.0" x2="540.0" y2="90.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <polyline points="600,150 600,200 100,200 100,125" fill="none" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="30" y="63" width="120" height="54" rx="8" fill="#c7d2fe" stroke="#6366f1" stroke-width="2"/>
  <text x="90" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">w = 0.5</text>
  <text x="90" y="105" text-anchor="middle" font-size="12" fill="#475569">∂L/∂w = −0.50</text>
  <rect x="200" y="63" width="120" height="54" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="260" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">z = 1.1</text>
  <text x="260" y="105" text-anchor="middle" font-size="12" fill="#475569">∂L/∂z = −0.25</text>
  <rect x="370" y="63" width="120" height="54" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="430" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">a = 0.75</text>
  <text x="430" y="105" text-anchor="middle" font-size="12" fill="#475569">∂L/∂a = −1.33</text>
  <rect x="540" y="63" width="120" height="54" rx="8" fill="#fecaca" stroke="#ef4444" stroke-width="2"/>
  <text x="600" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">L = 0.29</text>
  <text x="600" y="105" text-anchor="middle" font-size="12" fill="#475569">∂L/∂L = 1</text>
  <text x="515" y="225" text-anchor="middle" font-size="15" fill="#b91c1c">× (−1/a)</text>
  <text x="345" y="225" text-anchor="middle" font-size="15" fill="#b91c1c">× a(1 − a)</text>
  <text x="175" y="225" text-anchor="middle" font-size="15" fill="#b91c1c">× x</text>
  <text x="350" y="270" text-anchor="middle" font-size="15" font-weight="700" fill="#b91c1c">backward pass: multiply local derivatives (chain rule)</text>
</svg>
