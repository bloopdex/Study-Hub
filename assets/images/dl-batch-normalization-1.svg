<svg xmlns="http://www.w3.org/2000/svg" width="680" height="290" viewBox="0 0 680 290" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Batch normalization steps</title>
  <rect width="680" height="290" rx="16" fill="#f8fafc"/>
  <text x="340" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Batch norm on one neuron, batch of 3</text>
  <rect x="40" y="56" width="80" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="80" y="85" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">2</text>
  <rect x="132" y="56" width="80" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="172" y="85" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">4</text>
  <rect x="224" y="56" width="80" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="264" y="85" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">6</text>
  <text x="340" y="84" font-size="15" fill="#334155">raw: mean 4, sd 1.63</text>
  <text x="172" y="126" text-anchor="middle" font-size="22" fill="#94a3b8">↓</text>
  <rect x="40" y="136" width="80" height="44" rx="8" fill="#c7d2fe" stroke="#6366f1" stroke-width="2"/><text x="80" y="165" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">−1.22</text>
  <rect x="132" y="136" width="80" height="44" rx="8" fill="#c7d2fe" stroke="#6366f1" stroke-width="2"/><text x="172" y="165" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">0</text>
  <rect x="224" y="136" width="80" height="44" rx="8" fill="#c7d2fe" stroke="#6366f1" stroke-width="2"/><text x="264" y="165" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">1.22</text>
  <text x="340" y="164" font-size="15" fill="#334155">normalized: mean 0, sd 1</text>
  <text x="172" y="206" text-anchor="middle" font-size="22" fill="#94a3b8">↓</text>
  <rect x="40" y="216" width="80" height="44" rx="8" fill="#bbf7d0" stroke="#22c55e" stroke-width="2"/><text x="80" y="245" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">−1.45</text>
  <rect x="132" y="216" width="80" height="44" rx="8" fill="#bbf7d0" stroke="#22c55e" stroke-width="2"/><text x="172" y="245" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">1</text>
  <rect x="224" y="216" width="80" height="44" rx="8" fill="#bbf7d0" stroke="#22c55e" stroke-width="2"/><text x="264" y="245" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">3.45</text>
  <text x="340" y="244" font-size="15" font-weight="700" fill="#15803d">γ = 2, β = 1</text>
