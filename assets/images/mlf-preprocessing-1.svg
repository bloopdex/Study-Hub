  <rect x="114" y="216" width="64" height="44" rx="8" fill="#bbf7d0" stroke="#22c55e" stroke-width="2"/><text x="146" y="245" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">0.33</text>
  <rect x="188" y="216" width="64" height="44" rx="8" fill="#bbf7d0" stroke="#22c55e" stroke-width="2"/><text x="220" y="245" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">0.67</text>
