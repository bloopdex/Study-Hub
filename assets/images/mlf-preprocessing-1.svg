  <rect x="40" y="136" width="64" height="44" rx="8" fill="#c7d2fe" stroke="#6366f1" stroke-width="2"/><text x="72" y="165" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">−1.34</text>
  <rect x="114" y="136" width="64" height="44" rx="8" fill="#c7d2fe" stroke="#6366f1" stroke-width="2"/><text x="146" y="165" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">−0.45</text>
  <rect x="188" y="136" width="64" height="44" rx="8" fill="#c7d2fe" stroke="#6366f1" stroke-width="2"/><text x="220" y="165" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">0.45</text>
  <rect x="262" y="136" width="64" height="44" rx="8" fill="#c7d2fe" stroke="#6366f1" stroke-width="2"/><text x="294" y="165" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">1.34</text>
  <text x="350" y="164" font-size="15" fill="#334155">standardized: mean 0, sd 1</text>
