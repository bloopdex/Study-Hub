  <line x1="344" y1="285" x2="344" y2="290" stroke="#94a3b8"/>  <text x="344" y="304" text-anchor="middle" font-size="12" fill="#64748b">6</text>
  <line x1="432" y1="285" x2="432" y2="290" stroke="#94a3b8"/>  <text x="432" y="304" text-anchor="middle" font-size="12" fill="#64748b">8</text>
  <line x1="520" y1="285" x2="520" y2="290" stroke="#94a3b8"/>  <text x="520" y="304" text-anchor="middle" font-size="12" fill="#64748b">10</text>
  <line x1="75" y1="285" x2="80" y2="285" stroke="#94a3b8"/>  <text x="71" y="289" text-anchor="end" font-size="12" fill="#64748b">0</text>
  <line x1="75" y1="227.5" x2="80" y2="227.5" stroke="#94a3b8"/>  <text x="71" y="231.5" text-anchor="end" font-size="12" fill="#64748b">1</text>
  <line x1="75" y1="170" x2="80" y2="170" stroke="#94a3b8"/>  <text x="71" y="174" text-anchor="end" font-size="12" fill="#64748b">2</text>
  <line x1="75" y1="112.5" x2="80" y2="112.5" stroke="#94a3b8"/>  <text x="71" y="116.5" text-anchor="end" font-size="12" fill="#64748b">3</text>
  <line x1="75" y1="55" x2="80" y2="55" stroke="#94a3b8"/>  <text x="71" y="59" text-anchor="end" font-size="12" fill="#64748b">4</text>
  <text x="300" y="323" text-anchor="middle" font-size="13" fill="#475569">step</text>
  <text x="44" y="170" text-anchor="middle" font-size="13" fill="#475569" transform="rotate(-90 44 170)">w</text>
  <polyline points="80.0,112.5 520.0,112.5" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="440.79999999999995" y="101" text-anchor="start" font-size="13" font-weight="700" fill="#22c55e">minimum</text>
  <polyline points="80.0,285.0 124.0,250.5 168.0,222.9 212.0,200.8 256.0,183.2 300.0,169.0 344.0,157.7 388.0,148.7 432.0,141.4 476.0,135.7 520.0,131.0" fill="none" stroke="#94a3b8" stroke-width="2.5"/>
  <text x="366" y="158.5" text-anchor="start" font-size="13" font-weight="700" fill="#94a3b8">plain GD</text>
  <polyline points="80.0,285.0 124.0,250.5 168.0,191.8 212.0,123.2 256.0,59.3 300.0,12.4 344.0,-9.8 388.0,-5.3 432.0,22.3 476.0,65.2 520.0,113.3" fill="none" stroke="#6366f1" stroke-width="2.5"/>
  <text x="220.8" y="69.375" text-anchor="start" font-size="13" font-weight="700" fill="#6366f1">momentum</text>
