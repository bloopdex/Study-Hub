<svg xmlns="http://www.w3.org/2000/svg" width="580" height="350" viewBox="0 0 580 350" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Momentum versus gradient descent trajectories</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
  <rect width="580" height="350" rx="16" fill="#f8fafc"/>
  <text x="290" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">w over 10 steps: plain GD vs momentum</text>
  <rect x="80" y="55" width="440" height="230" fill="#ffffff" stroke="#cbd5e1"/>
  <line x1="80" y1="285" x2="80" y2="290" stroke="#94a3b8"/>  <text x="80" y="304" text-anchor="middle" font-size="12" fill="#64748b">0</text>
  <line x1="168" y1="285" x2="168" y2="290" stroke="#94a3b8"/>  <text x="168" y="304" text-anchor="middle" font-size="12" fill="#64748b">2</text>
