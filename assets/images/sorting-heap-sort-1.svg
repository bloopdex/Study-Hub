<svg xmlns="http://www.w3.org/2000/svg" width="560" height="350" viewBox="0 0 560 350" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">The max-heap built from [3, 1, 4, 1, 5] is [5, 3, 4, 1, 1], drawn as a tree and as an array</title>
  <rect width="560" height="350" rx="16" fill="#f8fafc"/>
  <text x="280" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Max-heap built from [3, 1, 4, 1, 5]</text>
  <g stroke="#94a3b8" stroke-width="2">
    <line x1="280" y1="80" x2="180" y2="150"/><line x1="280" y1="80" x2="380" y2="150"/>
    <line x1="180" y1="150" x2="120" y2="220"/><line x1="180" y1="150" x2="240" y2="220"/>
  </g>
  <g stroke-width="2" font-size="20" font-weight="600" text-anchor="middle" fill="#0f172a">
    <circle cx="280" cy="80" r="24" fill="#bbf7d0" stroke="#22c55e"/><text x="280" y="87">5</text>
    <circle cx="180" cy="150" r="24" fill="#c7d2fe" stroke="#6366f1"/><text x="180" y="157">3</text>
    <circle cx="380" cy="150" r="24" fill="#c7d2fe" stroke="#6366f1"/><text x="380" y="157">4</text>
    <circle cx="120" cy="220" r="24" fill="#e2e8f0" stroke="#94a3b8"/><text x="120" y="227">1</text>
    <circle cx="240" cy="220" r="24" fill="#e2e8f0" stroke="#94a3b8"/><text x="240" y="227">1</text>
  </g>
  <text x="330" y="74" font-size="14" fill="#15803d" font-weight="700">root = maximum</text>
  <text x="300" y="227" font-size="14" fill="#334155">every parent ≥ its children</text>
  <g stroke-width="2" font-size="18" font-weight="600" text-anchor="middle" fill="#0f172a">
    <rect x="135" y="268" width="50" height="40" rx="8" fill="#bbf7d0" stroke="#22c55e"/><text x="160" y="294">5</text>
    <rect x="193" y="268" width="50" height="40" rx="8" fill="#c7d2fe" stroke="#6366f1"/><text x="218" y="294">3</text>
    <rect x="251" y="268" width="50" height="40" rx="8" fill="#c7d2fe" stroke="#6366f1"/><text x="276" y="294">4</text>
    <rect x="309" y="268" width="50" height="40" rx="8" fill="#e2e8f0" stroke="#94a3b8"/><text x="334" y="294">1</text>
    <rect x="367" y="268" width="50" height="40" rx="8" fill="#e2e8f0" stroke="#94a3b8"/><text x="392" y="294">1</text>
  </g>
  <text x="60" y="294" font-size="14" fill="#334155">array:</text>
  <g font-size="12" text-anchor="middle" fill="#64748b">
    <text x="160" y="326">i = 0</text><text x="218" y="326">1</text><text x="276" y="326">2</text><text x="334" y="326">3</text><text x="392" y="326">4</text>
  </g>
  <text x="440" y="294" font-size="13" fill="#334155">children of i:</text>
  <text x="440" y="312" font-size="13" fill="#334155">2i + 1, 2i + 2</text>
</svg>
