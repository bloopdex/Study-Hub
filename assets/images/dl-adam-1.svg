<svg xmlns="http://www.w3.org/2000/svg" width="680" height="310" viewBox="0 0 680 310" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Adam first step values</title>
  <rect width="680" height="310" rx="16" fill="#f8fafc"/>
  <text x="340" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Adam, step 1 on (w − 3)²</text>
  <text x="82" y="66" text-anchor="middle" font-size="13" fill="#475569">first moment</text>
  <text x="178" y="66" text-anchor="middle" font-size="13" fill="#475569">second moment</text>
  <text x="274" y="66" text-anchor="middle" font-size="13" fill="#475569">step</text>
  <rect x="40" y="76" width="84" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="82" y="105" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">m = −0.6</text>
  <rect x="136" y="76" width="84" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="178" y="105" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">v = 0.036</text>
  <rect x="232" y="76" width="84" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="274" y="105" text-anchor="middle" font-size="20" font-weight="600" fill="#94a3b8"></text>
  <text x="340" y="104" font-size="15" fill="#334155">raw averages (start at 0)</text>
  <text x="178" y="146" text-anchor="middle" font-size="22" fill="#94a3b8">↓</text>
  <rect x="40" y="156" width="84" height="44" rx="8" fill="#c7d2fe" stroke="#6366f1" stroke-width="2"/><text x="82" y="185" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">m̂ = −6</text>
  <rect x="136" y="156" width="84" height="44" rx="8" fill="#c7d2fe" stroke="#6366f1" stroke-width="2"/><text x="178" y="185" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">v̂ = 36</text>
  <rect x="232" y="156" width="84" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="274" y="185" text-anchor="middle" font-size="20" font-weight="600" fill="#94a3b8"></text>
  <text x="340" y="184" font-size="15" fill="#334155">bias-corrected, t = 1</text>
  <text x="178" y="226" text-anchor="middle" font-size="22" fill="#94a3b8">↓</text>
  <rect x="40" y="236" width="84" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="82" y="265" text-anchor="middle" font-size="20" font-weight="600" fill="#94a3b8"></text>
  <rect x="136" y="236" width="84" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="178" y="265" text-anchor="middle" font-size="20" font-weight="600" fill="#94a3b8"></text>
  <rect x="232" y="236" width="84" height="44" rx="8" fill="#bbf7d0" stroke="#22c55e" stroke-width="2"/><text x="274" y="265" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">−0.1</text>
  <text x="340" y="264" font-size="15" font-weight="700" fill="#15803d">step = η·m̂/√v̂ → w = 0.1</text>
</svg>
