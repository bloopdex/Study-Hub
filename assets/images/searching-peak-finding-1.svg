<svg xmlns="http://www.w3.org/2000/svg" width="740" height="370" viewBox="0 0 740 370" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Peak finding compares mid with its right neighbour and walks uphill: 8 &gt; 6 go left, 5 &lt; 7 go right, 7 &lt; 8 go right, peak 8 at index 3</title>
  <rect width="740" height="370" rx="16" fill="#f8fafc"/>
  <text x="370" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Finding a peak in [2, 5, 7, 8, 6, 3, 1]</text>
  <rect x="30" y="56" width="50" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="55" y="85" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">2</text>
  <rect x="88" y="56" width="50" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="113" y="85" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">5</text>
  <rect x="146" y="56" width="50" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="171" y="85" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">7</text>
  <rect x="204" y="56" width="50" height="44" rx="8" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/><text x="229" y="85" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">8</text>
  <rect x="262" y="56" width="50" height="44" rx="8" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/><text x="287" y="85" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">6</text>
  <rect x="320" y="56" width="50" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="345" y="85" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">3</text>
  <rect x="378" y="56" width="50" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="403" y="85" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">1</text>
  <text x="450" y="84" font-size="15" fill="#334155">8 &gt; 6 → peak at mid or left</text>
  <text x="229" y="126" text-anchor="middle" font-size="22" fill="#94a3b8">↓</text>
  <rect x="30" y="136" width="50" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="55" y="165" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">2</text>
  <rect x="88" y="136" width="50" height="44" rx="8" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/><text x="113" y="165" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">5</text>
  <rect x="146" y="136" width="50" height="44" rx="8" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/><text x="171" y="165" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">7</text>
  <rect x="204" y="136" width="50" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="229" y="165" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">8</text>
  <rect x="262" y="136" width="50" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="287" y="165" text-anchor="middle" font-size="20" font-weight="600" fill="#94a3b8">6</text>
  <rect x="320" y="136" width="50" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="345" y="165" text-anchor="middle" font-size="20" font-weight="600" fill="#94a3b8">3</text>
  <rect x="378" y="136" width="50" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="403" y="165" text-anchor="middle" font-size="20" font-weight="600" fill="#94a3b8">1</text>
  <text x="450" y="164" font-size="15" fill="#334155">5 &lt; 7 → uphill, go right</text>
  <text x="229" y="206" text-anchor="middle" font-size="22" fill="#94a3b8">↓</text>
  <rect x="30" y="216" width="50" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="55" y="245" text-anchor="middle" font-size="20" font-weight="600" fill="#94a3b8">2</text>
  <rect x="88" y="216" width="50" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="113" y="245" text-anchor="middle" font-size="20" font-weight="600" fill="#94a3b8">5</text>
  <rect x="146" y="216" width="50" height="44" rx="8" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/><text x="171" y="245" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">7</text>
  <rect x="204" y="216" width="50" height="44" rx="8" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/><text x="229" y="245" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">8</text>
  <rect x="262" y="216" width="50" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="287" y="245" text-anchor="middle" font-size="20" font-weight="600" fill="#94a3b8">6</text>
  <rect x="320" y="216" width="50" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="345" y="245" text-anchor="middle" font-size="20" font-weight="600" fill="#94a3b8">3</text>
  <rect x="378" y="216" width="50" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="403" y="245" text-anchor="middle" font-size="20" font-weight="600" fill="#94a3b8">1</text>
  <text x="450" y="244" font-size="15" fill="#334155">7 &lt; 8 → uphill, go right</text>
  <text x="229" y="286" text-anchor="middle" font-size="22" fill="#94a3b8">↓</text>
  <rect x="30" y="296" width="50" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="55" y="325" text-anchor="middle" font-size="20" font-weight="600" fill="#94a3b8">2</text>
  <rect x="88" y="296" width="50" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="113" y="325" text-anchor="middle" font-size="20" font-weight="600" fill="#94a3b8">5</text>
  <rect x="146" y="296" width="50" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="171" y="325" text-anchor="middle" font-size="20" font-weight="600" fill="#94a3b8">7</text>
  <rect x="204" y="296" width="50" height="44" rx="8" fill="#bbf7d0" stroke="#22c55e" stroke-width="2"/><text x="229" y="325" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">8</text>
  <rect x="262" y="296" width="50" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="287" y="325" text-anchor="middle" font-size="20" font-weight="600" fill="#94a3b8">6</text>
  <rect x="320" y="296" width="50" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="345" y="325" text-anchor="middle" font-size="20" font-weight="600" fill="#94a3b8">3</text>
  <rect x="378" y="296" width="50" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="403" y="325" text-anchor="middle" font-size="20" font-weight="600" fill="#94a3b8">1</text>
  <text x="450" y="324" font-size="15" font-weight="700" fill="#15803d">lo = hi = 3 → peak is 8</text>
</svg>
