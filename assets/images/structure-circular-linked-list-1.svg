<svg xmlns="http://www.w3.org/2000/svg" width="560" height="330" viewBox="0 0 560 330" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Circular linked list 2 to 4 to 6 and back to 2, with the tail pointer on 6</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
  <rect width="560" height="330" rx="16" fill="#f8fafc"/>
  <text x="280" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Circular list 2 → 4 → 6 → back to 2</text>
  <line x1="296.6" y1="115.0" x2="383.4" y2="220.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="374.0" y1="240.0" x2="186.0" y2="240.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="176.6" y1="220.0" x2="263.4" y2="115.0" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="195.0" y="157.5" width="50.0" height="19" rx="4" fill="#f8fafc"/>
  <text x="220.0" y="172.5" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">wraps</text>
  <circle cx="280" cy="95" r="26" fill="#bbf7d0" stroke="#22c55e" stroke-width="2"/>
  <text x="280" y="101" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">2</text>
  <text x="280" y="59" text-anchor="middle" font-size="12" fill="#475569">head = tail-&gt;next</text>
  <circle cx="400" cy="240" r="26" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="400" y="246" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">4</text>
  <circle cx="160" cy="240" r="26" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/>
  <text x="160" y="246" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">6</text>
  <text x="160" y="288" text-anchor="middle" font-size="12" fill="#475569">tail</text>
</svg>
