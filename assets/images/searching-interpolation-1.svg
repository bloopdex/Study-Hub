<svg xmlns="http://www.w3.org/2000/svg" width="780" height="290" viewBox="0 0 780 290" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Interpolation search estimates position 5 and finds 60 in one probe, where binary search would start at 40</title>
  <rect width="780" height="290" rx="16" fill="#f8fafc"/>
  <text x="390" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Interpolation search for 60 in [10, 20, …, 70]</text>
  <rect x="30" y="56" width="50" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="55" y="85" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">10</text>
  <rect x="88" y="56" width="50" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="113" y="85" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">20</text>
  <rect x="146" y="56" width="50" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="171" y="85" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">30</text>
  <rect x="204" y="56" width="50" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="229" y="85" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">40</text>
  <rect x="262" y="56" width="50" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="287" y="85" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">50</text>
  <rect x="320" y="56" width="50" height="44" rx="8" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/><text x="345" y="85" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">60</text>
  <rect x="378" y="56" width="50" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="403" y="85" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">70</text>
  <text x="450" y="84" font-size="15" fill="#334155">pos = 0 + (60−10)·6/60 = 5</text>
  <text x="229" y="126" text-anchor="middle" font-size="22" fill="#94a3b8">↓</text>
  <rect x="30" y="136" width="50" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="55" y="165" text-anchor="middle" font-size="20" font-weight="600" fill="#94a3b8">10</text>
  <rect x="88" y="136" width="50" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="113" y="165" text-anchor="middle" font-size="20" font-weight="600" fill="#94a3b8">20</text>
  <rect x="146" y="136" width="50" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="171" y="165" text-anchor="middle" font-size="20" font-weight="600" fill="#94a3b8">30</text>
  <rect x="204" y="136" width="50" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="229" y="165" text-anchor="middle" font-size="20" font-weight="600" fill="#94a3b8">40</text>
  <rect x="262" y="136" width="50" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="287" y="165" text-anchor="middle" font-size="20" font-weight="600" fill="#94a3b8">50</text>
  <rect x="320" y="136" width="50" height="44" rx="8" fill="#bbf7d0" stroke="#22c55e" stroke-width="2"/><text x="345" y="165" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">60</text>
  <rect x="378" y="136" width="50" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="403" y="165" text-anchor="middle" font-size="20" font-weight="600" fill="#94a3b8">70</text>
  <text x="450" y="164" font-size="15" font-weight="700" fill="#15803d">a[5] = 60 → found in 1 probe</text>
  <text x="229" y="206" text-anchor="middle" font-size="22" fill="#94a3b8">↓</text>
  <rect x="30" y="216" width="50" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="55" y="245" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">10</text>
  <rect x="88" y="216" width="50" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="113" y="245" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">20</text>
  <rect x="146" y="216" width="50" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="171" y="245" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">30</text>
  <rect x="204" y="216" width="50" height="44" rx="8" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/><text x="229" y="245" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">40</text>
  <rect x="262" y="216" width="50" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="287" y="245" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">50</text>
  <rect x="320" y="216" width="50" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="345" y="245" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">60</text>
  <rect x="378" y="216" width="50" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="403" y="245" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">70</text>
  <text x="450" y="244" font-size="15" fill="#334155">binary search would probe 40 first</text>
</svg>
