<svg xmlns="http://www.w3.org/2000/svg" width="640" height="230" viewBox="0 0 640 230" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Naive Bayes scores</title>
  <rect width="640" height="230" rx="16" fill="#f8fafc"/>
