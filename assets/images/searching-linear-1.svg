  <rect x="184" y="56" width="60" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="214" y="85" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">9</text>
  <rect x="256" y="56" width="60" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="286" y="85" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">4</text>
  <text x="340" y="84" font-size="15" fill="#334155">7 ≠ 9 → next</text>
  <text x="178" y="126" text-anchor="middle" font-size="22" fill="#94a3b8">↓</text>
  <rect x="40" y="136" width="60" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="70" y="165" text-anchor="middle" font-size="20" font-weight="600" fill="#94a3b8">7</text>
  <rect x="112" y="136" width="60" height="44" rx="8" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/><text x="142" y="165" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">3</text>
  <rect x="184" y="136" width="60" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="214" y="165" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">9</text>
  <rect x="256" y="136" width="60" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="286" y="165" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">4</text>
  <text x="340" y="164" font-size="15" fill="#334155">3 ≠ 9 → next</text>
  <text x="178" y="206" text-anchor="middle" font-size="22" fill="#94a3b8">↓</text>
  <rect x="40" y="216" width="60" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="70" y="245" text-anchor="middle" font-size="20" font-weight="600" fill="#94a3b8">7</text>
  <rect x="112" y="216" width="60" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="142" y="245" text-anchor="middle" font-size="20" font-weight="600" fill="#94a3b8">3</text>
  <rect x="184" y="216" width="60" height="44" rx="8" fill="#bbf7d0" stroke="#22c55e" stroke-width="2"/><text x="214" y="245" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">9</text>
  <rect x="256" y="216" width="60" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="286" y="245" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">4</text>
  <text x="340" y="244" font-size="15" font-weight="700" fill="#15803d">9 = 9 → found at index 2</text>
