<svg xmlns="http://www.w3.org/2000/svg" width="620" height="290" viewBox="0 0 620 290" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Linear search checks 7, then 3, then finds 9 at index 2</title>
  <rect width="620" height="290" rx="16" fill="#f8fafc"/>
  <text x="310" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Linear search for 9 in [7, 3, 9, 4]</text>
