<svg xmlns="http://www.w3.org/2000/svg" width="660" height="390" viewBox="0 0 660 390" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Attention weights and output</title>
  <rect width="660" height="390" rx="16" fill="#f8fafc"/>
  <text x="330" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Attention for q = [1, 0]</text>
  <text x="82" y="66" text-anchor="middle" font-size="13" fill="#475569">k₁ = [1, 0]</text>
  <text x="178" y="66" text-anchor="middle" font-size="13" fill="#475569">k₂ = [0, 1]</text>
  <text x="274" y="66" text-anchor="middle" font-size="13" fill="#475569">k₃ = [1, 1]</text>
  <rect x="40" y="76" width="84" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="82" y="105" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">1</text>
  <rect x="136" y="76" width="84" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="178" y="105" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">0</text>
  <rect x="232" y="76" width="84" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="274" y="105" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">1</text>
  <text x="340" y="104" font-size="15" fill="#334155">dot product q·k</text>
  <text x="178" y="146" text-anchor="middle" font-size="22" fill="#94a3b8">↓</text>
  <rect x="40" y="156" width="84" height="44" rx="8" fill="#c7d2fe" stroke="#6366f1" stroke-width="2"/><text x="82" y="185" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">0.707</text>
  <rect x="136" y="156" width="84" height="44" rx="8" fill="#c7d2fe" stroke="#6366f1" stroke-width="2"/><text x="178" y="185" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">0</text>
  <rect x="232" y="156" width="84" height="44" rx="8" fill="#c7d2fe" stroke="#6366f1" stroke-width="2"/><text x="274" y="185" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">0.707</text>
  <text x="340" y="184" font-size="15" fill="#334155">scaled by 1/√2</text>
  <text x="178" y="226" text-anchor="middle" font-size="22" fill="#94a3b8">↓</text>
  <rect x="40" y="236" width="84" height="44" rx="8" fill="#bbf7d0" stroke="#22c55e" stroke-width="2"/><text x="82" y="265" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">0.40</text>
  <rect x="136" y="236" width="84" height="44" rx="8" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/><text x="178" y="265" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">0.20</text>
  <rect x="232" y="236" width="84" height="44" rx="8" fill="#bbf7d0" stroke="#22c55e" stroke-width="2"/><text x="274" y="265" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">0.40</text>
  <text x="340" y="264" font-size="15" fill="#334155">softmax weights</text>
  <text x="178" y="306" text-anchor="middle" font-size="22" fill="#94a3b8">↓</text>
  <rect x="40" y="316" width="84" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="82" y="345" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">[1, 0]</text>
  <rect x="136" y="316" width="84" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="178" y="345" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">[0, 1]</text>
  <rect x="232" y="316" width="84" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="274" y="345" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">[.5, .5]</text>
  <text x="340" y="344" font-size="15" font-weight="700" fill="#15803d">output = Σ w·v = [0.60, 0.40]</text>
