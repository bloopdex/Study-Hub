<svg xmlns="http://www.w3.org/2000/svg" width="560" height="370" viewBox="0 0 560 370" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Stack contents after each operation, bottom on the left</title>
  <rect width="560" height="370" rx="16" fill="#f8fafc"/>
  <text x="280" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Stack: push 5, push 3, pop, push 8</text>
  <rect x="40" y="56" width="60" height="44" rx="8" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/><text x="70" y="85" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">5</text>
  <text x="300" y="84" font-size="15" fill="#334155">push 5 → top = 0</text>
  <text x="70" y="126" text-anchor="middle" font-size="22" fill="#94a3b8">↓</text>
  <rect x="40" y="136" width="60" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="70" y="165" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">5</text>
  <rect x="112" y="136" width="60" height="44" rx="8" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/><text x="142" y="165" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">3</text>
  <text x="300" y="164" font-size="15" fill="#334155">push 3 → top = 1</text>
  <text x="106" y="206" text-anchor="middle" font-size="22" fill="#94a3b8">↓</text>
  <rect x="40" y="216" width="60" height="44" rx="8" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/><text x="70" y="245" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">5</text>
  <rect x="112" y="216" width="60" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="142" y="245" text-anchor="middle" font-size="20" font-weight="600" fill="#94a3b8">3</text>
  <text x="300" y="244" font-size="15" fill="#334155">pop → returns 3</text>
  <text x="106" y="286" text-anchor="middle" font-size="22" fill="#94a3b8">↓</text>
  <rect x="40" y="296" width="60" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="70" y="325" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">5</text>
  <rect x="112" y="296" width="60" height="44" rx="8" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/><text x="142" y="325" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">8</text>
  <text x="300" y="324" font-size="15" font-weight="700" fill="#15803d">push 8, peek → 8</text>
</svg>
