<svg xmlns="http://www.w3.org/2000/svg" width="600" height="280" viewBox="0 0 600 280" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">B-tree root 20 and 40 with children 10, 30, and 50 and 60</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
  <rect width="600" height="280" rx="16" fill="#f8fafc"/>
  <text x="300" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">B-tree after inserting 10 … 60 (max 3 keys per node)</text>
  <line x1="270.9" y1="110.0" x2="169.1" y2="180.0" stroke="#94a3b8" stroke-width="2"/>
  <line x1="300.0" y1="110.0" x2="300.0" y2="180.0" stroke="#94a3b8" stroke-width="2"/>
  <line x1="329.1" y1="110.0" x2="430.9" y2="180.0" stroke="#94a3b8" stroke-width="2"/>
  <rect x="245" y="70" width="110" height="40" rx="8" fill="#c7d2fe" stroke="#6366f1" stroke-width="2"/>
  <text x="300" y="96" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">20 | 40</text>
  <rect x="105" y="180" width="70" height="40" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="140" y="206" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">10</text>
  <rect x="265" y="180" width="70" height="40" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="300" y="206" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">30</text>
  <rect x="410" y="180" width="100" height="40" rx="8" fill="#bbf7d0" stroke="#22c55e" stroke-width="2"/>
  <text x="460" y="206" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">50 | 60</text>
  <text x="140" y="250" text-anchor="middle" font-size="15" fill="#64748b">&lt; 20</text>
  <text x="300" y="250" text-anchor="middle" font-size="15" fill="#64748b">20 … 40</text>
  <text x="460" y="250" text-anchor="middle" font-size="15" fill="#64748b">&gt; 40</text>
</svg>
