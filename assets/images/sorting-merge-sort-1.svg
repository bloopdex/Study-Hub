<svg xmlns="http://www.w3.org/2000/svg" width="700" height="390" viewBox="0 0 700 390" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Merging the sorted halves 1 4 and 2 3: take 1, take 2, take 3, then copy 4, giving 1 2 3 4</title>
  <rect width="700" height="390" rx="16" fill="#f8fafc"/>
  <text x="350" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Merging [1, 4] and [2, 3]: always take the smaller front</text>
  <text x="73" y="66" text-anchor="middle" font-size="13" fill="#475569">left</text>
  <text x="211" y="66" text-anchor="middle" font-size="13" fill="#475569">right</text>
  <text x="395" y="66" text-anchor="middle" font-size="13" fill="#475569">output</text>
  <rect x="30" y="76" width="40" height="44" rx="8" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/><text x="50" y="105" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">1</text>
  <rect x="76" y="76" width="40" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="96" y="105" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">4</text>
  <rect x="168" y="76" width="40" height="44" rx="8" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/><text x="188" y="105" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">2</text>
  <rect x="214" y="76" width="40" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="234" y="105" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">3</text>
  <text x="500" y="104" font-size="15" fill="#334155">1 ≤ 2 → take 1</text>
  <text x="165" y="146" text-anchor="middle" font-size="22" fill="#94a3b8">↓</text>
  <rect x="30" y="156" width="40" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="50" y="185" text-anchor="middle" font-size="17" font-weight="600" fill="#94a3b8">1</text>
  <rect x="76" y="156" width="40" height="44" rx="8" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/><text x="96" y="185" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">4</text>
  <rect x="168" y="156" width="40" height="44" rx="8" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/><text x="188" y="185" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">2</text>
  <rect x="214" y="156" width="40" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="234" y="185" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">3</text>
  <rect x="306" y="156" width="40" height="44" rx="8" fill="#c7d2fe" stroke="#6366f1" stroke-width="2"/><text x="326" y="185" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">1</text>
  <text x="500" y="184" font-size="15" fill="#334155">4 &gt; 2 → take 2</text>
  <text x="188" y="226" text-anchor="middle" font-size="22" fill="#94a3b8">↓</text>
  <rect x="30" y="236" width="40" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="50" y="265" text-anchor="middle" font-size="17" font-weight="600" fill="#94a3b8">1</text>
  <rect x="76" y="236" width="40" height="44" rx="8" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/><text x="96" y="265" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">4</text>
  <rect x="168" y="236" width="40" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="188" y="265" text-anchor="middle" font-size="17" font-weight="600" fill="#94a3b8">2</text>
  <rect x="214" y="236" width="40" height="44" rx="8" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/><text x="234" y="265" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">3</text>
  <rect x="306" y="236" width="40" height="44" rx="8" fill="#c7d2fe" stroke="#6366f1" stroke-width="2"/><text x="326" y="265" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">1</text>
  <rect x="352" y="236" width="40" height="44" rx="8" fill="#c7d2fe" stroke="#6366f1" stroke-width="2"/><text x="372" y="265" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">2</text>
  <text x="500" y="264" font-size="15" fill="#334155">4 &gt; 3 → take 3</text>
  <text x="211" y="306" text-anchor="middle" font-size="22" fill="#94a3b8">↓</text>
  <rect x="30" y="316" width="40" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="50" y="345" text-anchor="middle" font-size="17" font-weight="600" fill="#94a3b8">1</text>
  <rect x="76" y="316" width="40" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="96" y="345" text-anchor="middle" font-size="17" font-weight="600" fill="#94a3b8">4</text>
  <rect x="168" y="316" width="40" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="188" y="345" text-anchor="middle" font-size="17" font-weight="600" fill="#94a3b8">2</text>
  <rect x="214" y="316" width="40" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="234" y="345" text-anchor="middle" font-size="17" font-weight="600" fill="#94a3b8">3</text>
  <rect x="306" y="316" width="40" height="44" rx="8" fill="#bbf7d0" stroke="#22c55e" stroke-width="2"/><text x="326" y="345" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">1</text>
  <rect x="352" y="316" width="40" height="44" rx="8" fill="#bbf7d0" stroke="#22c55e" stroke-width="2"/><text x="372" y="345" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">2</text>
  <rect x="398" y="316" width="40" height="44" rx="8" fill="#bbf7d0" stroke="#22c55e" stroke-width="2"/><text x="418" y="345" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">3</text>
  <rect x="444" y="316" width="40" height="44" rx="8" fill="#bbf7d0" stroke="#22c55e" stroke-width="2"/><text x="464" y="345" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">4</text>
  <text x="500" y="344" font-size="15" font-weight="700" fill="#15803d">right empty → copy 4</text>
</svg>
