<svg xmlns="http://www.w3.org/2000/svg" width="560" height="370" viewBox="0 0 560 370" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">One pass of bubble sort on [5, 1, 4, 2]: three comparisons, three swaps, 5 ends in its final place</title>
  <rect width="560" height="370" rx="16" fill="#f8fafc"/>
  <text x="280" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Bubble sort, pass 1 on [5, 1, 4, 2]</text>
  <g font-size="20" font-weight="600" text-anchor="middle" fill="#0f172a" stroke-width="2">
    <!-- row 1: compare 5 and 1 -->
    <rect x="40" y="56" width="60" height="44" rx="8" fill="#fde68a" stroke="#f59e0b"/><text x="70" y="85">5</text>
    <rect x="112" y="56" width="60" height="44" rx="8" fill="#fde68a" stroke="#f59e0b"/><text x="142" y="85">1</text>
    <rect x="184" y="56" width="60" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8"/><text x="214" y="85">4</text>
    <rect x="256" y="56" width="60" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8"/><text x="286" y="85">2</text>
    <!-- row 2: compare 5 and 4 -->
    <rect x="40" y="136" width="60" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8"/><text x="70" y="165">1</text>
    <rect x="112" y="136" width="60" height="44" rx="8" fill="#fde68a" stroke="#f59e0b"/><text x="142" y="165">5</text>
    <rect x="184" y="136" width="60" height="44" rx="8" fill="#fde68a" stroke="#f59e0b"/><text x="214" y="165">4</text>
    <rect x="256" y="136" width="60" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8"/><text x="286" y="165">2</text>
    <!-- row 3: compare 5 and 2 -->
    <rect x="40" y="216" width="60" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8"/><text x="70" y="245">1</text>
    <rect x="112" y="216" width="60" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8"/><text x="142" y="245">4</text>
    <rect x="184" y="216" width="60" height="44" rx="8" fill="#fde68a" stroke="#f59e0b"/><text x="214" y="245">5</text>
    <rect x="256" y="216" width="60" height="44" rx="8" fill="#fde68a" stroke="#f59e0b"/><text x="286" y="245">2</text>
    <!-- row 4: result -->
    <rect x="40" y="296" width="60" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8"/><text x="70" y="325">1</text>
    <rect x="112" y="296" width="60" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8"/><text x="142" y="325">4</text>
    <rect x="184" y="296" width="60" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8"/><text x="214" y="325">2</text>
    <rect x="256" y="296" width="60" height="44" rx="8" fill="#bbf7d0" stroke="#22c55e"/><text x="286" y="325">5</text>
  </g>
  <g font-size="22" fill="#94a3b8" text-anchor="middle"><text x="178" y="126">↓</text><text x="178" y="206">↓</text><text x="178" y="286">↓</text></g>
  <g font-size="15" fill="#334155">
    <text x="340" y="84">5 &gt; 1 → swap</text>
    <text x="340" y="164">5 &gt; 4 → swap</text>
    <text x="340" y="244">5 &gt; 2 → swap</text>
    <text x="340" y="324" font-weight="700" fill="#15803d">5 is in its final place</text>
  </g>
</svg>
