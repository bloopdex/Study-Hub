  <rect x="192" y="136" width="64" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="224" y="165" text-anchor="middle" font-size="20" font-weight="600" fill="#94a3b8">x₂</text>
  <text x="300" y="164" font-size="15" fill="#334155">C2 true (x₃)</text>
