<svg xmlns="http://www.w3.org/2000/svg" width="750" height="290" viewBox="0 0 750 290" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Rotated array search: the left half 4 to 7 is sorted and does not contain 0, so go right; then the half 0 to 1 is sorted and contains 0, so go left and find 0 at index 4</title>
  <rect width="750" height="290" rx="16" fill="#f8fafc"/>
  <text x="375" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Searching for 0 in the rotated array [4, 5, 6, 7, 0, 1, 2]</text>
  <rect x="30" y="56" width="50" height="44" rx="8" fill="#c7d2fe" stroke="#6366f1" stroke-width="2"/><text x="55" y="85" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">4</text>
  <rect x="88" y="56" width="50" height="44" rx="8" fill="#c7d2fe" stroke="#6366f1" stroke-width="2"/><text x="113" y="85" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">5</text>
  <rect x="146" y="56" width="50" height="44" rx="8" fill="#c7d2fe" stroke="#6366f1" stroke-width="2"/><text x="171" y="85" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">6</text>
  <rect x="204" y="56" width="50" height="44" rx="8" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/><text x="229" y="85" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">7</text>
  <rect x="262" y="56" width="50" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="287" y="85" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">0</text>
  <rect x="320" y="56" width="50" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="345" y="85" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">1</text>
  <rect x="378" y="56" width="50" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="403" y="85" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">2</text>
  <text x="450" y="84" font-size="15" fill="#334155">4..7 sorted, 0 not there → right</text>
  <text x="229" y="126" text-anchor="middle" font-size="22" fill="#94a3b8">↓</text>
  <rect x="30" y="136" width="50" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="55" y="165" text-anchor="middle" font-size="20" font-weight="600" fill="#94a3b8">4</text>
  <rect x="88" y="136" width="50" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="113" y="165" text-anchor="middle" font-size="20" font-weight="600" fill="#94a3b8">5</text>
  <rect x="146" y="136" width="50" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="171" y="165" text-anchor="middle" font-size="20" font-weight="600" fill="#94a3b8">6</text>
  <rect x="204" y="136" width="50" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="229" y="165" text-anchor="middle" font-size="20" font-weight="600" fill="#94a3b8">7</text>
  <rect x="262" y="136" width="50" height="44" rx="8" fill="#c7d2fe" stroke="#6366f1" stroke-width="2"/><text x="287" y="165" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">0</text>
  <rect x="320" y="136" width="50" height="44" rx="8" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/><text x="345" y="165" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">1</text>
  <rect x="378" y="136" width="50" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="403" y="165" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">2</text>
  <text x="450" y="164" font-size="15" fill="#334155">0..1 sorted, 0 is there → left</text>
  <text x="229" y="206" text-anchor="middle" font-size="22" fill="#94a3b8">↓</text>
  <rect x="30" y="216" width="50" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="55" y="245" text-anchor="middle" font-size="20" font-weight="600" fill="#94a3b8">4</text>
  <rect x="88" y="216" width="50" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="113" y="245" text-anchor="middle" font-size="20" font-weight="600" fill="#94a3b8">5</text>
  <rect x="146" y="216" width="50" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="171" y="245" text-anchor="middle" font-size="20" font-weight="600" fill="#94a3b8">6</text>
  <rect x="204" y="216" width="50" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="229" y="245" text-anchor="middle" font-size="20" font-weight="600" fill="#94a3b8">7</text>
  <rect x="262" y="216" width="50" height="44" rx="8" fill="#bbf7d0" stroke="#22c55e" stroke-width="2"/><text x="287" y="245" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">0</text>
  <rect x="320" y="216" width="50" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="345" y="245" text-anchor="middle" font-size="20" font-weight="600" fill="#94a3b8">1</text>
  <rect x="378" y="216" width="50" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="403" y="245" text-anchor="middle" font-size="20" font-weight="600" fill="#94a3b8">2</text>
  <text x="450" y="244" font-size="15" font-weight="700" fill="#15803d">mid = 0 → found at index 4</text>
</svg>
