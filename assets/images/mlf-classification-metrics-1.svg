  <text x="202" y="66" text-anchor="middle" font-size="13" fill="#475569">predicted −</text>
  <rect x="40" y="76" width="100" height="44" rx="8" fill="#bbf7d0" stroke="#22c55e" stroke-width="2"/><text x="90" y="105" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">TP 40</text>
  <rect x="152" y="76" width="100" height="44" rx="8" fill="#fecaca" stroke="#ef4444" stroke-width="2"/><text x="202" y="105" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">FN 20</text>
  <text x="300" y="104" font-size="15" fill="#334155">actually positive (60)</text>
  <text x="146" y="146" text-anchor="middle" font-size="22" fill="#94a3b8">↓</text>
  <rect x="40" y="156" width="100" height="44" rx="8" fill="#fecaca" stroke="#ef4444" stroke-width="2"/><text x="90" y="185" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">FP 10</text>
  <rect x="152" y="156" width="100" height="44" rx="8" fill="#bbf7d0" stroke="#22c55e" stroke-width="2"/><text x="202" y="185" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">TN 30</text>
