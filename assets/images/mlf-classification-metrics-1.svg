<svg xmlns="http://www.w3.org/2000/svg" width="600" height="230" viewBox="0 0 600 230" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Confusion matrix TP 40 FN 20 FP 10 TN 30</title>
  <rect width="600" height="230" rx="16" fill="#f8fafc"/>
