<svg xmlns="http://www.w3.org/2000/svg" width="560" height="360" viewBox="0 0 560 360" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">k-means clusters and centroids</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
  <rect width="560" height="360" rx="16" fill="#f8fafc"/>
  <text x="280" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">k-means converges in 2 iterations</text>
  <rect x="80" y="55" width="420" height="250" fill="#ffffff" stroke="#cbd5e1"/>
  <line x1="150" y1="305" x2="150" y2="310" stroke="#94a3b8"/>  <text x="150" y="324" text-anchor="middle" font-size="12" fill="#64748b">1</text>
  <line x1="220" y1="305" x2="220" y2="310" stroke="#94a3b8"/>  <text x="220" y="324" text-anchor="middle" font-size="12" fill="#64748b">2</text>
  <line x1="290" y1="305" x2="290" y2="310" stroke="#94a3b8"/>  <text x="290" y="324" text-anchor="middle" font-size="12" fill="#64748b">3</text>
  <line x1="360" y1="305" x2="360" y2="310" stroke="#94a3b8"/>  <text x="360" y="324" text-anchor="middle" font-size="12" fill="#64748b">4</text>
  <line x1="430" y1="305" x2="430" y2="310" stroke="#94a3b8"/>  <text x="430" y="324" text-anchor="middle" font-size="12" fill="#64748b">5</text>
  <line x1="75" y1="255" x2="80" y2="255" stroke="#94a3b8"/>  <text x="71" y="259" text-anchor="end" font-size="12" fill="#64748b">1</text>
  <line x1="75" y1="205" x2="80" y2="205" stroke="#94a3b8"/>  <text x="71" y="209" text-anchor="end" font-size="12" fill="#64748b">2</text>
  <line x1="75" y1="155" x2="80" y2="155" stroke="#94a3b8"/>  <text x="71" y="159" text-anchor="end" font-size="12" fill="#64748b">3</text>
  <line x1="75" y1="105" x2="80" y2="105" stroke="#94a3b8"/>  <text x="71" y="109" text-anchor="end" font-size="12" fill="#64748b">4</text>
  <polyline points="336.9,155.0 395.0,105.0" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="6 4"/>
  <circle cx="336.9" cy="155.0" r="7" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="336.9" y="174.0" text-anchor="middle" font-size="12" fill="#334155">after iteration 1</text>
  <circle cx="150.0" cy="255.0" r="8" fill="#38bdf8" stroke="#0f172a" stroke-width="1"/>
  <circle cx="220.0" cy="255.0" r="8" fill="#38bdf8" stroke="#0f172a" stroke-width="1"/>
  <circle cx="360.0" cy="105.0" r="8" fill="#f59e0b" stroke="#0f172a" stroke-width="1"/>
  <circle cx="430.0" cy="105.0" r="8" fill="#f59e0b" stroke="#0f172a" stroke-width="1"/>
  <circle cx="185.0" cy="255.0" r="5" fill="#0369a1" stroke="#0f172a" stroke-width="1"/>
  <text x="185.0" y="238.0" text-anchor="middle" font-size="12" fill="#334155">c₁ = (1.5, 1)</text>
  <circle cx="395.0" cy="105.0" r="5" fill="#b45309" stroke="#0f172a" stroke-width="1"/>
  <text x="395.0" y="88.0" text-anchor="middle" font-size="12" fill="#334155">c₂ = (4.5, 4)</text>
