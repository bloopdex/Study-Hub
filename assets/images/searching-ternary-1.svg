<svg xmlns="http://www.w3.org/2000/svg" width="760" height="210" viewBox="0 0 760 210" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Ternary search probes 5 and 13, keeps the middle third, then probes 7 and 11 and finds 11 at index 5</title>
  <rect width="760" height="210" rx="16" fill="#f8fafc"/>
  <text x="380" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Ternary search for 11 in [1, 3, 5, …, 17]</text>
  <rect x="30" y="56" width="44" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="52" y="85" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">1</text>
  <rect x="80" y="56" width="44" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="102" y="85" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">3</text>
  <rect x="130" y="56" width="44" height="44" rx="8" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/><text x="152" y="85" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">5</text>
  <rect x="180" y="56" width="44" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="202" y="85" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">7</text>
  <rect x="230" y="56" width="44" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="252" y="85" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">9</text>
  <rect x="280" y="56" width="44" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="302" y="85" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">11</text>
  <rect x="330" y="56" width="44" height="44" rx="8" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/><text x="352" y="85" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">13</text>
  <rect x="380" y="56" width="44" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="402" y="85" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">15</text>
  <rect x="430" y="56" width="44" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="452" y="85" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">17</text>
  <text x="490" y="84" font-size="15" fill="#334155">5 &lt; 11 &lt; 13 → keep middle third</text>
  <text x="252" y="126" text-anchor="middle" font-size="22" fill="#94a3b8">↓</text>
  <rect x="30" y="136" width="44" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="52" y="165" text-anchor="middle" font-size="17" font-weight="600" fill="#94a3b8">1</text>
  <rect x="80" y="136" width="44" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="102" y="165" text-anchor="middle" font-size="17" font-weight="600" fill="#94a3b8">3</text>
  <rect x="130" y="136" width="44" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="152" y="165" text-anchor="middle" font-size="17" font-weight="600" fill="#94a3b8">5</text>
  <rect x="180" y="136" width="44" height="44" rx="8" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/><text x="202" y="165" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">7</text>
  <rect x="230" y="136" width="44" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="252" y="165" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">9</text>
  <rect x="280" y="136" width="44" height="44" rx="8" fill="#bbf7d0" stroke="#22c55e" stroke-width="2"/><text x="302" y="165" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">11</text>
  <rect x="330" y="136" width="44" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="352" y="165" text-anchor="middle" font-size="17" font-weight="600" fill="#94a3b8">13</text>
  <rect x="380" y="136" width="44" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="402" y="165" text-anchor="middle" font-size="17" font-weight="600" fill="#94a3b8">15</text>
  <rect x="430" y="136" width="44" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="452" y="165" text-anchor="middle" font-size="17" font-weight="600" fill="#94a3b8">17</text>
  <text x="490" y="164" font-size="15" font-weight="700" fill="#15803d">m2 = 11 → found at index 5</text>
</svg>
