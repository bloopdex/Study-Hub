<svg xmlns="http://www.w3.org/2000/svg" width="700" height="370" viewBox="0 0 700 370" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Lomuto partition of 5 2 6 1 4 with pivot 4: 2 and 1 move into the left zone, then the pivot lands at index 2, giving 2 1 4 5 6</title>
  <rect width="700" height="370" rx="16" fill="#f8fafc"/>
  <text x="350" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Quick sort: partition [5, 2, 6, 1, 4] around pivot 4</text>
  <rect x="40" y="56" width="60" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="70" y="85" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">5</text>
  <rect x="112" y="56" width="60" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="142" y="85" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">2</text>
  <rect x="184" y="56" width="60" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="214" y="85" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">6</text>
  <rect x="256" y="56" width="60" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="286" y="85" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">1</text>
  <rect x="328" y="56" width="60" height="44" rx="8" fill="#a5b4fc" stroke="#4338ca" stroke-width="2"/><text x="358" y="85" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">4</text>
  <text x="412" y="84" font-size="15" fill="#334155">pivot = 4 (last element)</text>
  <text x="214" y="126" text-anchor="middle" font-size="22" fill="#94a3b8">↓</text>
  <rect x="40" y="136" width="60" height="44" rx="8" fill="#bae6fd" stroke="#38bdf8" stroke-width="2"/><text x="70" y="165" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">2</text>
  <rect x="112" y="136" width="60" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="142" y="165" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">5</text>
  <rect x="184" y="136" width="60" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="214" y="165" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">6</text>
  <rect x="256" y="136" width="60" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="286" y="165" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">1</text>
  <rect x="328" y="136" width="60" height="44" rx="8" fill="#a5b4fc" stroke="#4338ca" stroke-width="2"/><text x="358" y="165" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">4</text>
  <text x="412" y="164" font-size="15" fill="#334155">2 ≤ 4 → swap into left zone</text>
  <text x="214" y="206" text-anchor="middle" font-size="22" fill="#94a3b8">↓</text>
  <rect x="40" y="216" width="60" height="44" rx="8" fill="#bae6fd" stroke="#38bdf8" stroke-width="2"/><text x="70" y="245" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">2</text>
  <rect x="112" y="216" width="60" height="44" rx="8" fill="#bae6fd" stroke="#38bdf8" stroke-width="2"/><text x="142" y="245" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">1</text>
  <rect x="184" y="216" width="60" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="214" y="245" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">6</text>
  <rect x="256" y="216" width="60" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="286" y="245" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">5</text>
  <rect x="328" y="216" width="60" height="44" rx="8" fill="#a5b4fc" stroke="#4338ca" stroke-width="2"/><text x="358" y="245" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">4</text>
  <text x="412" y="244" font-size="15" fill="#334155">1 ≤ 4 → swap into left zone</text>
  <text x="214" y="286" text-anchor="middle" font-size="22" fill="#94a3b8">↓</text>
  <rect x="40" y="296" width="60" height="44" rx="8" fill="#bae6fd" stroke="#38bdf8" stroke-width="2"/><text x="70" y="325" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">2</text>
  <rect x="112" y="296" width="60" height="44" rx="8" fill="#bae6fd" stroke="#38bdf8" stroke-width="2"/><text x="142" y="325" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">1</text>
  <rect x="184" y="296" width="60" height="44" rx="8" fill="#bbf7d0" stroke="#22c55e" stroke-width="2"/><text x="214" y="325" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">4</text>
  <rect x="256" y="296" width="60" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="286" y="325" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">5</text>
  <rect x="328" y="296" width="60" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="358" y="325" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">6</text>
  <text x="412" y="324" font-size="15" font-weight="700" fill="#15803d">pivot swapped into its final place</text>
</svg>
