<svg xmlns="http://www.w3.org/2000/svg" width="660" height="290" viewBox="0 0 660 290" font-family="Inter, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Unrolled RNN</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
  <rect width="660" height="290" rx="16" fill="#f8fafc"/>
  <text x="330" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">An RNN unrolled over two steps</text>
  <line x1="135.0" y1="120.0" x2="215.0" y2="120.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="150.0" y="110.0" width="50.0" height="19" rx="4" fill="#f8fafc"/>
