  <line x1="325.0" y1="120.0" x2="425.0" y2="120.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="350.0" y="110.0" width="50.0" height="19" rx="4" fill="#f8fafc"/>
  <text x="375.0" y="125.0" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">× 0.8</text>
  <line x1="270.0" y1="218.0" x2="270.0" y2="147.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="245.0" y="172.5" width="50.0" height="19" rx="4" fill="#f8fafc"/>
  <text x="270.0" y="187.5" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">× 0.5</text>
  <line x1="480.0" y1="218.0" x2="480.0" y2="147.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="455.0" y="172.5" width="50.0" height="19" rx="4" fill="#f8fafc"/>
  <text x="480.0" y="187.5" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">× 0.5</text>
  <polyline points="535,120 610,120" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="25" y="93" width="110" height="54" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="80" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#94a3b8">h₀ = 0</text>
  <rect x="215" y="93" width="110" height="54" rx="8" fill="#c7d2fe" stroke="#6366f1" stroke-width="2"/>
  <text x="270" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">tanh cell</text>
  <text x="270" y="135" text-anchor="middle" font-size="12" fill="#475569">h₁ = 0.46</text>
  <rect x="425" y="93" width="110" height="54" rx="8" fill="#c7d2fe" stroke="#6366f1" stroke-width="2"/>
  <text x="480" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">tanh cell</text>
  <text x="480" y="135" text-anchor="middle" font-size="12" fill="#475569">h₂ = 0.70</text>
  <rect x="215" y="218" width="110" height="54" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="270" y="251" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">x₁ = 1</text>
  <rect x="425" y="218" width="110" height="54" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="480" y="251" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">x₂ = 1</text>
  <text x="630" y="105" text-anchor="middle" font-size="15" fill="#64748b">…</text>
  <text x="375" y="60" text-anchor="middle" font-size="15" font-weight="700" fill="#4338ca">same weights at every step</text>
</svg>
